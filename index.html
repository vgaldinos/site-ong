<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>ONG Mãos que Acolhem</title>
    <link rel="stylesheet" href="css/style.css">

<body>

    <!-- Link de Acessibilidade: Salto para o Conteúdo Principal -->
    <a href="#app" class="skip-link">Pular para o conteúdo principal</a>

    <header>
        <div class="header-container">
            <img src="imagens/logo.png" alt="Logotipo oficial da ONG Mãos que Acolhem">
            
            <button id="menu-button" class="menu-hamburger" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menu de navegação">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="nav-principal" aria-label="Navegação principal">
                <ul id="menu-principal" class="menu-principal">
                    <li><a href="#inicio" class="nav-link">Início</a></li>
                    <li class="has-dropdown">

            </nav>

    </footer>

    <script src="js/sweetalert2.all.min.js"></script>

    <script src="js/projetos.js"></script>

    <script src="js/index.js"></script>
